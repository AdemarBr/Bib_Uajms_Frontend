<button
  type="button"
  role="switch"
  class="relative h-5 w-9 shrink-0 cursor-pointer rounded-full transition-colors disabled:cursor-not-allowed disabled:opacity-50"
  [class.bg-brand-accent]="activo()"
  [class.bg-interruptor-inactivo]="!activo()"
  [attr.aria-checked]="activo()"
  [attr.aria-label]="etiqueta()"
  [disabled]="deshabilitado()"
  (click)="cambio.emit(!activo())"
>
  <span
    class="absolute top-0.5 left-0.5 size-4 rounded-full bg-gray-0 transition-transform"
    [class.translate-x-4]="activo()"
  ></span>
</button>
