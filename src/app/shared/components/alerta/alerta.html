<div
  class="flex w-full max-w-80 flex-col gap-xs rounded-sm border bg-gray-100 p-md"
  [class.border-gray-500]="tono() === 'error'"
  [class.border-gray-300]="tono() === 'exito'"
  [attr.role]="tono() === 'error' ? 'alert' : 'status'"
>
  <p class="text-body-strong text-gray-900">{{ titulo() }}</p>
  @if (mensaje()) {
    <p class="text-caption text-gray-600">{{ mensaje() }}</p>
  }
</div>
