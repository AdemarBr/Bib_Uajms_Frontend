<div class="flex flex-col gap-5">
  @if (titulo(); as t) {
    <h1 class="text-h2 text-gray-900">Historial de cambios: {{ t }}</h1>

    <!-- RF4.6, curso alternativo: sin cambios, el libro conserva los datos con los que se registró. -->
    <app-tabla
      [columnas]="columnas"
      [filas]="cambios()"
      mensajeVacio="El libro conserva los datos con los que fue registrado."
    >
      <ng-template appCelda="fecha" let-fila>{{ fila.fecha | fecha }}</ng-template>
      <ng-template appCelda="campoModificado" let-fila>
        {{ nombreCampo(fila.campoModificado) }}
      </ng-template>
      <ng-template appCelda="valorAnterior" let-fila>{{ fila.valorAnterior ?? '—' }}</ng-template>
      <ng-template appCelda="valorNuevo" let-fila>{{ fila.valorNuevo ?? '—' }}</ng-template>
    </app-tabla>
  } @else {
    <h1 class="text-h2 text-gray-900">Historial de cambios</h1>
    @if (error(); as e) {
      <app-alerta [titulo]="e.titulo" [mensaje]="e.detalle" />
    }
  }
</div>
